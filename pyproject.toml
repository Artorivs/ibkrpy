[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "ibkrpy"
version = "0.0.1"
description = "極簡化、高內聚的 IBKR 非同步量化交易系統"
authors = ["Your Name <you@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
# tensorflow-metal 1.2.0 只提供到 cp312 的 wheel；scipy 1.18 / numpy 2 需 >=3.12
python = ">=3.12,<3.13"
ib_insync = "^0.9.86"
pandas = "^3.1.1"
# pandas 3.1 需要 numpy>=2.0.2；TensorFlow 2.19 限制 numpy<2.2
numpy = ">=2.0.2,<2.2"
PyYAML = "^6.0.3"
pandas-market-calendars = "^5.6.0"

# --- 資料庫與基礎建設 ---
SQLAlchemy = "^2.1.8"
aiosqlite = ">=0.22.1,<1.0"
python-dotenv = "^1.2.4"
rich = "^15.0.0"
joblib = "^1.6.0"
caffeine = { version = "^0.5", markers = "sys_platform == 'darwin'" }

# --- 交易與外部介面 ---
backtrader = "^1.9.78"
yfinance = "^1.8.0"
aiohttp = "^3.14.5"
fredapi = "^0.5.2"

# --- 預測模型依賴 ---
# tensorflow-metal 1.2.0 只相容到 TensorFlow 2.19.x (2.20 起載入 Metal 外掛會失敗)。
# TensorFlow 2.13 起官方 tensorflow 套件已內含 Apple Silicon wheel，tensorflow-macos 已停止維護，勿再安裝。
tensorflow = "~2.19.1"
tensorflow-metal = { version = "1.2.0", markers = "sys_platform == 'darwin' and platform_machine == 'arm64'" }
keras = "^3.15.1"
# TensorFlow 2.19 是以 ml-dtypes 0.5 / h5py 3.14 建置的；TF 2.21 起也明確限制 h5py<3.15
ml-dtypes = ">=0.5.1,<0.6"
h5py = ">=3.11,<3.15"
hmmlearn = "^0.3.3"
scikit-learn = "^1.9.1"
statsmodels = "^0.15.0"
arch = "^8.0.0"

# --- 最佳化與視覺化依賴 ---
optuna = "^5.0.0"
matplotlib = "^3.11.2"
seaborn = "^0.13.2"
plotly = "^7.1.0"

[tool.poetry.group.dev.dependencies]
jupyterlab = "^4.6.6"
mkdocs-material = "^9.8.1"
black = "^26.10.1"
flake8 = "^7.5.0"
